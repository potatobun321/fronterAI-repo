# ==============================================================================
# FRONTIER AI — CLOUDFLARE WRANGLER CONFIGURATION
# ==============================================================================

name = "fronterai-repo"
compatibility_date = "2024-04-01"
main = "worker.js"

# Static assets directory for frontend
[assets]
directory = "./public"
binding = "ASSETS"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "frontier-production-db"
database_id = "6f92a95b-b7eb-459f-9d75-1ae9a037d1c7"

# Environment Variables (Non-sensitive)
[vars]
NODE_ENV = "production"

